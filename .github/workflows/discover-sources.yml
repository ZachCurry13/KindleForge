name: Discover sources

# Once a week (and on demand): look for package repositories and apps worth a
# human's attention and write them to DISCOVERED.md / catalog/discovered.json.
# Plain scripts, no AI. Nothing is enabled or trusted automatically: a
# maintainer reads the list and promotes entries (CONTRIBUTING.md).

on:
  schedule:
    - cron: "11 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-sources
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: python3 scripts/test_discover.py

      - name: Discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/discover_sources.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- DISCOVERED.md catalog/discovered.json; then echo "no change"; exit 0; fi
          git config user.name "kindleforge-discover[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add DISCOVERED.md catalog/discovered.json
          git commit -m "Update discovered sources"
          git pull --rebase
          git push
