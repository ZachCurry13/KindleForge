name: Sync package info

# Once a day (and on demand) re-reads the upstream KPM package list and fills
# in names, authors and descriptions in catalog/config.json from each
# package's own GitHub project. New packages appear automatically. Anything a
# person wrote in config.json is never overwritten; see scripts/sync_packages.py.
# Kindles pick the result up on their next Refresh: no app update needed.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-packages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: python3 scripts/test_sync_packages.py

      - name: Sync from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_packages.py catalog/config.json

      - name: Commit if changed
        run: |
          python3 -c "import json; json.load(open('catalog/config.json'))"
          if git diff --quiet -- catalog/config.json; then echo "no change"; exit 0; fi
          git config user.name "kindleforge-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add catalog/config.json
          git commit -m "Sync package info from upstream"
          git pull --rebase
          git push
