<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>KindleForge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <script src="assets/polyfill.js"></script>
</head>
<body>
    <div class="container">
        <div id="topbar">
            <input id="search" type="text" placeholder="Search apps, authors..." autocomplete="off" autocorrect="off" autocapitalize="off">
            <button id="refresh" type="button">Refresh</button>
        </div>

        <div id="update" class="hidden"></div>

        <div id="tabs"></div>

        <div id="banner" class="hidden"></div>

        <main id="packages">
            <!-- Packages Inserted Through JS -->
        </main>

        <div id="pager">
            <button id="prev" type="button">&laquo; Page Up</button>
            <span id="pageinfo"></span>
            <button id="next" type="button">Page Down &raquo;</button>
        </div>

        <footer>
            <p>KindleForge KPM Edition; Original By Penguins184</p>
            <p><span id="app-version">KindleForge</span> | <span id="js-status">JS Not Working!</span> | <span id="abi-status">Unknown ABI!</span> | <span id="catalog-status">No Catalog</span></p>
        </footer>
    </div>

    <div id="overlay" class="hidden"></div>

    <script src="script.js"></script>
</body>
</html>
